name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - integration/yadet-ai-and-reminder-safety

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Restored stable debug keystore from repository secret."
          elif [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "Restored debug keystore from repository file."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not configured. This run will use a temporary key and its APK may not update an existing installation."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s debug.keystore
          ls -l debug.keystore

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Restore Firebase configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored Firebase configuration from GitHub Actions secret."
          elif [ -f "app/google-services.json" ]; then
            echo "Firebase configuration file is present."
          else
            echo "::error::Firebase configuration is missing. Configure FIREBASE_GOOGLE_SERVICES_JSON before building an APK."
            exit 1
          fi
          python -m json.tool app/google-services.json > /dev/null
          test -s app/google-services.json

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build APK (retry transient Gradle download failures)
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew :app:assembleDebug --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry."
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Yadet-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
