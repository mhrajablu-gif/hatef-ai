name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Keystore
        run: |
          echo "Restoring debug.keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64."
          else
            echo "debug.keystore.base64 not found, generating new debug keystore..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          ls -l debug.keystore

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret. Add the complete app/google-services.json contents from Firebase Console."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -c "import json; d=json.load(open('app/google-services.json')); assert any(c.get('client_info',{}).get('android_client_info',{}).get('package_name') == 'com.aistudio.hatefassistant.pxkrmq' for c in d.get('client',[])), 'Firebase config package name does not match the Android applicationId'"
          echo "Firebase configuration restored and package name verified."

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadet-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

# Re-run build after Firebase repository secret setup.
