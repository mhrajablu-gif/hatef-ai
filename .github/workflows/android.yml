name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Stable Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Stable signing key is missing. Configure the existing DEBUG_KEYSTORE_BASE64 secret; refusing to generate a temporary key that would break app updates."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          echo "Restored stable debug keystore from repository secret."
          test -s debug.keystore

      - name: Print and retain stable signing certificate fingerprint
        run: |
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | tee /tmp/yadet-signing-certificate.txt
          KEYSTORE_CERT_SHA256="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' /tmp/yadet-signing-certificate.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Could not read SHA-256 fingerprint from the stable keystore."
            exit 1
          fi
          echo "Stable keystore SHA-256: $KEYSTORE_CERT_SHA256"
          echo "KEYSTORE_CERT_SHA256=$KEYSTORE_CERT_SHA256" >> "$GITHUB_ENV"

      # Gemini requires Firebase AI Logic configuration for the side-by-side package.
      # Add a Firebase Android app for com.aistudio.hatefassistant.pxkrmq.safe and store
      # its google-services.json contents in the GOOGLE_SERVICES_JSON_SAFE repository secret.
      - name: Restore Firebase configuration for side-by-side app
        env:
          GOOGLE_SERVICES_JSON_SAFE: ${{ secrets.GOOGLE_SERVICES_JSON_SAFE }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_SAFE" ]; then
            echo "::warning::Firebase config for the .safe package is not set. Tests will run, but APK creation is intentionally skipped."
            echo "FIREBASE_CONFIG_READY=false" >> "$GITHUB_ENV"
          else
            mkdir -p app
            printf '%s' "$GOOGLE_SERVICES_JSON_SAFE" > app/google-services.json
            python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          ]
          expected = "com.aistudio.hatefassistant.pxkrmq.safe"
          if expected not in packages:
              print("::error::google-services.json has no client for the .safe application ID.")
              sys.exit(1)
          print("Firebase configuration matches the side-by-side application ID.")
          PY
            echo "FIREBASE_CONFIG_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Yadet-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK
        if: env.FIREBASE_CONFIG_READY == 'true'
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        if: env.FIREBASE_CONFIG_READY == 'true'
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package, version, and stable signing certificate
        if: env.FIREBASE_CONFIG_READY == 'true'
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -nE "1s/^package: name='([^']+)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "1s/^package:.*versionCode='([^']+)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -nE "1s/^package:.*versionName='([^']+)'.*/\\1/p")"
          test "$PACKAGE_NAME" = "com.aistudio.hatefassistant.pxkrmq.safe"
          test "$VERSION_CODE" = "25"
          test "$VERSION_NAME" = "1.18.6"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          APK_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | awk '/V2 Signer: certificate SHA-256 digest:/ {print tolower($NF); exit}' | tr -d ':')"
          if [ -z "$APK_CERT_SHA256" ] || [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Could not read both APK and keystore signing fingerprints."
            exit 1
          fi
          if [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the stable keystore. Refusing to upload an un-updatable APK."
            exit 1
          fi
          echo "APK package/version and signing certificate match the established update baseline."

      - name: Prepare versioned APK filename
        if: env.FIREBASE_CONFIG_READY == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/yadet-v1.18.6.apk
          test -s release/yadet-v1.18.6.apk
          sha256sum release/yadet-v1.18.6.apk

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Yadet-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: env.FIREBASE_CONFIG_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yadet-v1.18.6
          path: release/yadet-v1.18.6.apk
          retention-days: 14

# Rebuild after stable signing-key restoration and Android version bump.
