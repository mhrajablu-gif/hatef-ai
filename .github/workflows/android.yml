name: Build Yadet Safe Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/yadet-1.19.7-safe-offline

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Side-by-Side APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Stable signing key secret is missing."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          test -s debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:|SHA-256:'

      - name: Prepare local secrets configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then cp .env.example .env; fi
          # This side-by-side test build intentionally has no Firebase app registration.
          # Local reminder features remain testable; Gemini requests fall back to local parsing.

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Build safe test APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK package, version, and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          echo "$BADGING" | grep -F "name='com.aistudio.hatefassistant.pxkrmq.safe'"
          echo "$BADGING" | grep -F "versionCode='36'"
          echo "$BADGING" | grep -F "versionName='1.19.7-test'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare versioned APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/yadet-1.19.7-test-safe.apk
          sha256sum release/yadet-1.19.7-test-safe.apk
          ls -lh release/yadet-1.19.7-test-safe.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yadet-test-reports-1.19.7
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload safe test APK
        uses: actions/upload-artifact@v7
        with:
          name: yadet-1.19.7-test-safe
          path: release/yadet-1.19.7-test-safe.apk
          retention-days: 14
