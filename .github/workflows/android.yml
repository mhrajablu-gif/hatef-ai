name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore and validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON. Firebase AI cannot initialize without google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python - <<'PY'
          import json
          import sys

          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle = f.read()
          expected = next(
              (
                  line.split('"')[1]
                  for line in gradle.splitlines()
                  if "applicationId" in line and "=" in line and '"' in line
              ),
              None,
          )
          if not expected:
              print("::error::Could not determine applicationId from app/build.gradle.kts")
              sys.exit(1)
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if expected not in packages:
              print(f"::error::Firebase config package mismatch. Expected {expected}; found {packages}")
              sys.exit(1)
          print(f"Firebase config validated for {expected}.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "Restoring the established debug.keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::error::Signing keystore is unavailable. Add the established keystore as DEBUG_KEYSTORE_BASE64 (base64) or provide debug.keystore.base64. Refusing to generate a new key because that would make this APK incompatible with existing installations."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Established debug keystore restored and alias verified."
          ls -l debug.keystore

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signing certificate
        env:
          EXPECTED_DEBUG_CERT_SHA256: "66:66:FB:95:74:B3:90:CF:2D:65:93:EF:81:6E:F4:5A:79:A6:04:FC:2F:BE:B7:13:1C:8C:3C:07:2B:34:48:F4"
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found; refusing to publish an APK without verifying its certificate."
            exit 1
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)" || {
            echo "$CERT_OUTPUT"
            echo "::error::apksigner could not verify the generated APK."
            exit 1
          }
          printf '%s\\n' "$CERT_OUTPUT" | grep -E 'SHA-256 digest:' || true
          ACTUAL_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | grep -E 'SHA-256 digest:' | head -n 1 | sed 's/.*SHA-256 digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="$(printf '%s' "$EXPECTED_DEBUG_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_SHA256="$(printf '%s' "$ACTUAL_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signing certificate mismatch. Expected SHA-256 $EXPECTED_DEBUG_CERT_SHA256; found ${ACTUAL_SHA256:-<unavailable>}. APK will not be uploaded because it cannot update the established installation."
            exit 1
          fi
          echo "APK signing certificate matches the established installation."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadet-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
