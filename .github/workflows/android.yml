name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore and validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON. Firebase AI cannot initialize without google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python - <<'PY'
          import json
          import sys

          with open("app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          with open("app/build.gradle.kts", encoding="utf-8") as f:
              gradle = f.read()
          match = re.search(r'applicationId\\s*=\\s*"([^"]+)"', gradle)
          if not match:
              print("::error::Could not determine applicationId from app/build.gradle.kts")
              sys.exit(1)
          expected = match.group(1)
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if expected not in packages:
              print(f"::error::Firebase config package mismatch. Expected {expected}; found {packages}")
              sys.exit(1)
          print(f"Firebase config validated for {expected}.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Keystore
        run: |
          echo "Restoring debug.keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64."
          else
            echo "debug.keystore.base64 not found, generating new debug keystore..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          ls -l debug.keystore

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadet-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
